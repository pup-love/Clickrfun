<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A secret place 🐾</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#fff0fb;background:radial-gradient(circle at 20% 15%,#633a79 0,transparent 32%),radial-gradient(circle at 85% 80%,#7b376a 0,transparent 34%),#130b22;display:grid;place-items:center}.room{width:min(760px,100%);text-align:center;padding:clamp(22px,5vw,48px);border:1px solid #bc80c5;border-radius:28px;background:rgba(35,19,51,.9);box-shadow:0 0 50px #9e54a844}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa6e2;margin:.3em 0}.emoji{font-size:clamp(3rem,12vw,6rem);filter:drop-shadow(0 0 16px #ffa1e9)}p{line-height:1.7;color:#f2d9f1}button,a{display:inline-block;border:0;border-radius:13px;padding:12px 17px;margin:6px;background:#ed8acb;color:#29122f;font-weight:bold;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#ffc0eb}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:22px 0}.chip{padding:8px 12px;border-radius:99px;background:#512d62;color:#ffe0f6}
 
.room{padding:clamp(14px,3vw,30px);overflow:hidden;position:relative}.room:before{content:"✦  ·  ˚  ✧  ·  ✦  ·  ˚  ✧";display:block;color:#ffd9f5;letter-spacing:.65em;font-size:1rem;opacity:.8;animation:twinkle 4s infinite alternate}
.scene{height:clamp(260px,48vw,380px);position:relative;overflow:hidden;border:4px solid #f4c8ed;border-radius:22px;margin:20px 0 25px;box-shadow:0 12px 35px #08041177,inset 0 -25px 45px #2a174b66;background:linear-gradient(#8f83d2,#f3b5dd 65%,#7dba9d 66%);isolation:isolate}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 19%,#fff6d7 0 25px,transparent 27px),radial-gradient(circle at 12% 17%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 27% 30%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 65% 12%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 88% 38%,#fff9 0 2px,transparent 3px);z-index:-1}
.scene .hill{position:absolute;bottom:-60px;width:75%;height:170px;background:#8fc88d;border-radius:50%;left:-10%;box-shadow:250px -15px 0 10px #76b987,540px 0 0 0 #a5d5a0}
.scene .path{position:absolute;bottom:-65px;left:34%;width:33%;height:190px;border-radius:50% 50% 0 0;background:#e9c6a4;transform:rotate(-12deg);border:5px solid #c59b9c}
.scene .scene-object{position:absolute;display:grid;place-items:center;filter:drop-shadow(0 8px 6px #24112b44);animation:floaty 3s ease-in-out infinite;user-select:none}
.scene-object.big{font-size:clamp(4rem,12vw,7rem);left:calc(50% - 65px);top:22%}.scene-object.left{font-size:clamp(2.5rem,7vw,4.5rem);left:9%;bottom:19%}.scene-object.right{font-size:clamp(2.5rem,7vw,4.5rem);right:10%;bottom:20%;animation-delay:-1.4s}.scene-object.tiny{font-size:2rem;left:44%;top:9%;animation-delay:-.7s}
.scene-sign{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:99px;background:#30183cdd;border:1px solid #fff7;color:#fff1fc;white-space:nowrap;font-size:.9rem;max-width:92%;overflow:hidden;text-overflow:ellipsis}
body[data-room="star-nook"] .scene{background:linear-gradient(#222a66,#8a68c8 62%,#c1a7ed 63%,#6e9e9b)}
body[data-room="shell-garden"] .scene{background:linear-gradient(#7bd7ec,#b8f1ef 58%,#f4d6a8 59%,#d5a9b7)}
body[data-room="moon-hideout"] .scene{background:linear-gradient(#171b50,#5553a2 64%,#b7a8e6 65%,#6e86a2)}
body[data-room="mushroom-village"] .scene{background:linear-gradient(#9ad9d0,#d8e8b2 64%,#9bc78c 65%,#568b74)}
body[data-room="sparkle-cave"] .scene{background:linear-gradient(#26184e,#654e9e 60%,#4e3478 61%,#2a1d50)}
body[data-room="cloud-cafe"] .scene{background:linear-gradient(#8cdaf5,#e1c9ff 64%,#fff0f8 65%,#a8b7e8)}
body[data-room="undersea-den"] .scene{background:linear-gradient(#143d78,#368eb1 60%,#45c6c4 61%,#207b91)}
body[data-room="star-nook"] .scene .hill{background:#9d87dc;box-shadow:250px -15px 0 10px #7667bb,540px 0 0 0 #a99de5}
body[data-room="shell-garden"] .scene .hill{background:#e5b8a2;box-shadow:250px -15px 0 10px #dca6b5,540px 0 0 0 #f1d4a7}
body[data-room="moon-hideout"] .scene .hill{background:#b6b3e9;box-shadow:250px -15px 0 10px #8c91d4,540px 0 0 0 #c3b7ef}
body[data-room="sparkle-cave"] .scene .hill{background:#4f3a87;box-shadow:250px -15px 0 10px #34225e,540px 0 0 0 #654d9b}
body[data-room="undersea-den"] .scene .hill{background:#29a7b1;box-shadow:250px -15px 0 10px #178b9f,540px 0 0 0 #57c8c3}
.chips{margin:18px 0}.chip{border:1px solid #b984cb;box-shadow:0 5px 14px #08041133}.room-actions{margin-top:20px}.room-actions a{margin:5px}
@keyframes floaty{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -12px;rotate:3deg}}
@keyframes twinkle{from{opacity:.4}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="room"><div id="roomEmoji" class="emoji">✨</div><p>✦ YOU FOUND A HIDDEN PLACE ✦</p><h1 id="roomTitle">A secret room!</h1><p id="roomStory">You followed a tiny sparkle and found somewhere special.</p><div class="scene" id="roomScene" aria-label="Illustration of this secret place"><div class="hill"></div><div class="path"></div><span class="scene-object tiny" id="sceneTiny">✨</span><span class="scene-object left" id="sceneLeft">🌷</span><span class="scene-object big" id="sceneBig">🌟</span><span class="scene-object right" id="sceneRight">🧸</span><div class="scene-sign" id="sceneSign">A tiny hidden corner of Pawtopia</div></div><p id="roomActivity">✨ Look around. This place has a little magic of its own.</p><div class="chips" id="roomLoot"></div><p id="roomHint">Not everybody knows this place exists... shhh 🤫</p><div class="room-actions"><a href="pawtopia.html">← Sneak back to the map</a><a href="https://pup-love.github.io/Clickrfun/">🏡 Clickrfun home</a><br><button id="finishLevel">🐾 Finish level</button><button id="findAnother">🗺️ Back to map</button></div></main>
<script>
const rooms={
'star-nook':{icon:'🌟',name:'The Star Nook',story:'A little attic above the clouds, full of sleepy stars that make wishes when nobody is looking.',loot:['✨ Wish dust','🌙 Moon pillow','⭐ Tiny constellation'],hint:'Make a wish before you leave. The stars are listening.',scene:['🌟','☁️','🪐','🌙','The sleepy stars attic'],activity:'🌠 A star falls into a tiny jar when you tap the glowing sparkles.'},
'shell-garden':{icon:'🐚',name:'The Shell Garden',story:'A hidden beach garden where seashells hum tiny songs and the tide leaves gifts for kind paws.',loot:['🫧 Bubble charm','🐚 Singing shell','🪸 Coral crown'],hint:'Listen closely... the ocean is trying to tell you a secret.',scene:['🐚','🌴','🦀','🐠','The singing-shell shoreline'],activity:'🫧 Little bubbles float up from the sand and pop into glitter.'},
'moon-hideout':{icon:'🌙',name:'The Moonbeam Hideout',story:'A quiet rooftop tucked behind the moon, with fluffy clouds for beanbags and a telescope made of glitter.',loot:['🌙 Moon badge','☁️ Cloud cushion','🪐 Pocket planet'],hint:'This is the perfect place to recharge your little paws.',scene:['🌙','☁️','🔭','🪐','A rooftop above the clouds'],activity:'🔭 The telescope shows a different tiny constellation if you blink slowly.'},
'mushroom-village':{icon:'🍄',name:'Tiny Mushroom Village',story:'Tiny doors hide under giant mushrooms. The residents are very small, very polite, and absolutely obsessed with snacks.',loot:['🍓 Berry jam','🍄 Mushroom hat','🧚 Fairy bell'],hint:'Knock three times before visiting the mushroom mayor.',scene:['🍄','🌿','🧚','🏡','The teeny-tiny village square'],activity:'🏡 The mushroom doors creak open and a fairy waves hello.'},
'sparkle-cave':{icon:'💎',name:'The Sparkle Cave',story:'Crystals glow in every color and your footsteps make little musical notes across the glittering floor.',loot:['💎 Crystal shard','🎶 Echo melody','🪄 Glitter wand'],hint:'Every crystal remembers a kind thing someone said.',scene:['💎','🔮','🪄','✨','The singing crystal cavern'],activity:'💎 The crystals pulse with color and ring like tiny bells.'},
'cloud-cafe':{icon:'☁️',name:'The Cloud Café',story:'A floating café serving cloud-shaped pancakes, strawberry milk, and tiny cups of warm moon tea.',loot:['🥞 Cloud pancake','🍓 Pink milk','☕ Moon tea'],hint:'The barista is a sleepy bunny. Please be nice to them.',scene:['☁️','🍓','🥞','☕','The café floating in the clouds'],activity:'🥞 Fresh cloud pancakes are cooling on the windowsill. Yum!'},
'undersea-den':{icon:'🫧',name:'The Bubblegum Undersea Den',story:'Under the pink waves is a cozy den filled with glowing jellyfish lamps and bubblegum-colored coral.',loot:['🪼 Jellyfish lamp','🫧 Bubble crown','🐠 Fish friend'],hint:'Bubbles carry whispers from every room you have visited.',scene:['🫧','🪸','🪼','🐠','The secret sea-glass hideout'],activity:'🪼 Jellyfish lamps drift gently above the coral furniture.'}
};
const params=new URLSearchParams(location.search);const room=rooms[params.get('room')]||rooms['star-nook'];document.body.dataset.room=params.get('room')||'star-nook';document.title=room.name+' 🐾';document.getElementById('roomEmoji').textContent=room.icon;document.getElementById('roomTitle').textContent=room.name;document.getElementById('roomStory').textContent=room.story;document.getElementById('roomHint').textContent=room.hint;document.getElementById('roomActivity').textContent=room.activity;document.getElementById('sceneBig').textContent=room.scene[0];document.getElementById('sceneLeft').textContent=room.scene[1];document.getElementById('sceneRight').textContent=room.scene[2];document.getElementById('sceneTiny').textContent=room.scene[3];document.getElementById('sceneSign').textContent=room.scene[4];document.getElementById('roomLoot').innerHTML=room.loot.map(x=>'<span class="chip">'+x+'</span>').join('');const level=Math.max(1,Number(params.get('level'))||1);document.getElementById('finishLevel').textContent=level>=14?'🏆 Finish adventure!':'🐾 Finish Level '+level+' & unlock Level '+(level+1);document.getElementById('finishLevel').addEventListener('click',()=>{let n=1;try{n=Number(localStorage.getItem('pawtopia_level'))||Number(localStorage.getItem('pawtopia_pawtopiaLevel'))||1;localStorage.setItem('pawtopia_level',String(Math.max(n,Math.min(14,level+1))))}catch(e){}location.href='pawtopia.html'});document.getElementById('findAnother').addEventListener('click',()=>location.href='pawtopia.html');
</script></body></html>
