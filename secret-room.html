<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A secret place 🐾</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;font-family:Arial,sans-serif;color:#fff0fb;background:radial-gradient(circle at 20% 15%,#633a79 0,transparent 32%),radial-gradient(circle at 85% 80%,#7b376a 0,transparent 34%),#130b22;display:grid;place-items:center}.room{width:min(760px,100%);text-align:center;padding:clamp(22px,5vw,48px);border:1px solid #bc80c5;border-radius:28px;background:rgba(35,19,51,.9);box-shadow:0 0 50px #9e54a844}h1{font-size:clamp(2rem,7vw,3.5rem);color:#ffa6e2;margin:.3em 0}.emoji{font-size:clamp(3rem,12vw,6rem);filter:drop-shadow(0 0 16px #ffa1e9)}p{line-height:1.7;color:#f2d9f1}button,a{display:inline-block;border:0;border-radius:13px;padding:12px 17px;margin:6px;background:#ed8acb;color:#29122f;font-weight:bold;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#ffc0eb}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:22px 0}.chip{padding:8px 12px;border-radius:99px;background:#512d62;color:#ffe0f6}
</style>
</head>
<body><main class="room"><div id="roomEmoji" class="emoji">✨</div><p>✦ YOU FOUND A HIDDEN PLACE ✦</p><h1 id="roomTitle">A secret room!</h1><p id="roomStory">You followed a tiny sparkle and found somewhere special.</p><div class="chips" id="roomLoot"></div><p id="roomHint">Not everybody knows this place exists... shhh 🤫</p><a href="pawtopia.html">← Sneak back to Pawtopia</a><a href="https://pup-love.github.io/Clickrfun/">🏡 Clickrfun home</a><br><button id="findAnother">🕵️ Find another secret</button></main>
<script>
const rooms={
'star-nook':{icon:'🌟',name:'The Star Nook',story:'A little attic above the clouds, full of sleepy stars that make wishes when nobody is looking.',loot:['✨ Wish dust','🌙 Moon pillow','⭐ Tiny constellation'],hint:'Make a wish before you leave. The stars are listening.'},
'shell-garden':{icon:'🐚',name:'The Shell Garden',story:'A hidden beach garden where seashells hum tiny songs and the tide leaves gifts for kind paws.',loot:['🫧 Bubble charm','🐚 Singing shell','🪸 Coral crown'],hint:'Listen closely... the ocean is trying to tell you a secret.'},
'moon-hideout':{icon:'🌙',name:'The Moonbeam Hideout',story:'A quiet rooftop tucked behind the moon, with fluffy clouds for beanbags and a telescope made of glitter.',loot:['🌙 Moon badge','☁️ Cloud cushion','🪐 Pocket planet'],hint:'This is the perfect place to recharge your little paws.'},
'mushroom-village':{icon:'🍄',name:'Tiny Mushroom Village',story:'Tiny doors hide under giant mushrooms. The residents are very small, very polite, and absolutely obsessed with snacks.',loot:['🍓 Berry jam','🍄 Mushroom hat','🧚 Fairy bell'],hint:'Knock three times before visiting the mushroom mayor.'},
'sparkle-cave':{icon:'💎',name:'The Sparkle Cave',story:'Crystals glow in every color and your footsteps make little musical notes across the glittering floor.',loot:['💎 Crystal shard','🎶 Echo melody','🪄 Glitter wand'],hint:'Every crystal remembers a kind thing someone said.'},
'cloud-cafe':{icon:'☁️',name:'The Cloud Café',story:'A floating café serving cloud-shaped pancakes, strawberry milk, and tiny cups of warm moon tea.',loot:['🥞 Cloud pancake','🍓 Pink milk','☕ Moon tea'],hint:'The barista is a sleepy bunny. Please be nice to them.'},
'undersea-den':{icon:'🫧',name:'The Bubblegum Undersea Den',story:'Under the pink waves is a cozy den filled with glowing jellyfish lamps and bubblegum-colored coral.',loot:['🪼 Jellyfish lamp','🫧 Bubble crown','🐠 Fish friend'],hint:'Bubbles carry whispers from every room you have visited.'}
};
const params=new URLSearchParams(location.search);const room=rooms[params.get('room')]||rooms['star-nook'];document.title=room.name+' 🐾';document.getElementById('roomEmoji').textContent=room.icon;document.getElementById('roomTitle').textContent=room.name;document.getElementById('roomStory').textContent=room.story;document.getElementById('roomHint').textContent=room.hint;document.getElementById('roomLoot').innerHTML=room.loot.map(x=>'<span class="chip">'+x+'</span>').join('');document.getElementById('findAnother').addEventListener('click',()=>location.href='pawtopia.html');
</script></body></html>
